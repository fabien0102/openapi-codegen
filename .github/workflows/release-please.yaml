on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

name: Run Release Please
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{secrets.GITHUB_TOKEN}}

      # The logic below handles the npm publication:
      - name: Checkout Repository
        uses: actions/checkout@v7
        if: ${{ steps.release.outputs.releases_created }}

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
        if: ${{ steps.release.outputs.releases_created }}

      - name: Build Packages
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          pnpm install
          pnpm build

      # Release Please has already incremented versions and published tags
      # This is pushing the new packages to npm stage
      - name: Stage released packages
        if: ${{ steps.release.outputs.releases_created }}
        uses: actions/github-script@v9
        env:
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
        with:
          script: |
            import { execFileSync } from "node:child_process";

            const paths = JSON.parse(process.env.PATHS_RELEASED);

            for (const path of paths) {
              console.log(`Staging package: ${path}`);

              execFileSync("npm", ["stage", "publish"], {
                cwd: path,
                stdio: "inherit",
              });
            }
