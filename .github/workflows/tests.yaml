name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@22
          cache: true
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: Check types, linting and code style
        run: pnpm check
      - name: Run tests
        run: pnpm test
